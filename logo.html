<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Logo Radar Client</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
font-family:system-ui,sans-serif;background:#e6e4df;color:#0a0a0c;gap:20px;padding:24px}
.box{width:min(300px,80vw);height:min(300px,80vw);background:#d4451a;border-radius:28px;
display:grid;place-items:center;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.box span{font-size:clamp(120px,40vw,180px);font-weight:800;color:#fffaf7;font-family:Arial Black,Arial,sans-serif;line-height:1}
a{display:inline-block;background:#0a0a0c;color:#fff;padding:14px 22px;border-radius:10px;text-decoration:none;font-weight:700}
p{color:#5c5c66;max-width:360px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="box"><span>R</span></div>
<p>Capture d’écran (Cmd+Shift+4) du carré orange, ou télécharge le SVG.</p>
<a href="/logo.svg" download="radar-client-logo.svg">Télécharger logo.svg</a>
</body>
</html>
