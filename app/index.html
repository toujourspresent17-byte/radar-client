<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>Cockpit — Radar Client</title>
<meta name="theme-color" content="#e6e4df"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#e6e4df;--surface:#faf9f7;--ink:#0a0a0c;--muted:#3a3a42;--soft:#5c5c66;--border:rgba(0,0,0,.14);--border-strong:rgba(0,0,0,.26);--accent:#d4451a;--ok:#1a7a4c;--warn:#b45309;--font:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:88px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.app-top{position:sticky;top:0;z-index:40;background:rgba(230,228,223,.96);backdrop-filter:blur(12px);border-bottom:1.5px solid var(--border-strong);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--mono);font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:8px}
.mark{width:24px;height:24px;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--accent)}
.pill{font-family:var(--mono);font-size:.7rem;padding:4px 8px;border-radius:999px;background:#fff;border:1px solid var(--border)}
.pill.on{border-color:var(--ok);color:var(--ok)}
.pill.off{border-color:var(--accent);color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.tabs{display:none}
.screen{display:none}.screen.active{display:block}
h1{font-size:1.35rem;margin:8px 0 4px}
.sub{font-family:var(--mono);font-size:.78rem;color:var(--soft);margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px 12px}
.stat b{display:block;font-family:var(--mono);font-size:1.25rem;color:var(--accent)}
.stat span{font-size:.75rem;color:var(--soft);font-family:var(--mono)}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{font-size:.95rem;margin-bottom:6px}
.card p{font-size:.88rem;color:var(--muted);line-height:1.5}
.meta{font-family:var(--mono);font-size:.72rem;color:var(--soft);margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:none;border-radius:10px;padding:10px 14px;font-weight:600;font-size:.85rem;cursor:pointer;font-family:var(--font)}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--border-strong)}
.btn-ok{background:#d8f3e4;color:var(--ok)}
.btn-skip{background:#f3e8e6;color:var(--accent)}
.badge{display:inline-block;font-family:var(--mono);font-size:.65rem;padding:3px 8px;border-radius:6px;background:rgba(212,69,26,.12);color:var(--accent);margin-bottom:8px}
.badge.ok{background:#d8f3e4;color:var(--ok)}
.badge.warn{background:#fef3c7;color:var(--warn)}
.nav-bottom{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1.5px solid var(--border-strong);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50}
.nav-bottom button{background:none;border:none;font-family:var(--mono);font-size:.68rem;padding:10px 4px;color:var(--soft);cursor:pointer}
.nav-bottom button.active{color:var(--accent);font-weight:700}
.empty{text-align:center;padding:32px 16px;color:var(--soft);font-size:.9rem}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:.85rem;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1}
@media(min-width:800px){
  body{padding-bottom:24px}
  .nav-bottom{display:none}
  .tabs{display:flex;gap:8px;margin-bottom:20px}
  .tabs button{border:1.5px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 14px;font-family:var(--mono);font-size:.8rem;cursor:pointer}
  .tabs button.active{border-color:var(--accent);color:var(--accent);font-weight:700}
  .wrap{padding:24px;max-width:900px}
}
</style>
</head>
<body>
<header class="app-top">
  <div class="brand"><span class="mark">R</span> Radar · Cockpit</div>
  <button type="button" class="pill on" id="runToggle" title="Pause globale">RUN ON</button>
</header>
<main class="wrap">
  <div class="tabs" id="deskTabs">
    <button type="button" data-tab="today" class="active">Aujourd'hui</button>
    <button type="button" data-tab="queue">File</button>
    <button type="button" data-tab="validate">À valider</button>
    <button type="button" data-tab="journal">Journal</button>
  </div>

  <section class="screen active" id="screen-today">
    <h1>Aujourd'hui</h1>
    <p class="sub" id="todayDate"></p>
    <div class="stats">
      <div class="stat"><b id="sSent">0</b><span>envoyés 7j</span></div>
      <div class="stat"><b id="sPending">0</b><span>à valider</span></div>
      <div class="stat"><b id="sPaused">0</b><span>en pause</span></div>
    </div>
    <p class="badge">Cerveau · 3 priorités</p>
    <div id="priorities"></div>
  </section>

  <section class="screen" id="screen-queue">
    <h1>File d'attente</h1>
    <p class="sub">Relances prévues / envoyées</p>
    <div id="queueList"></div>
  </section>

  <section class="screen" id="screen-validate">
    <h1>À valider</h1>
    <p class="sub">Cas ambigus — décision humaine</p>
    <div id="validateList"></div>
  </section>

  <section class="screen" id="screen-journal">
    <h1>Journal</h1>
    <p class="sub">7 derniers jours</p>
    <div id="journalList"></div>
  </section>
</main>

<nav class="nav-bottom" id="mobileNav">
  <button type="button" data-tab="today" class="active">Aujourd'hui</button>
  <button type="button" data-tab="queue">File</button>
  <button type="button" data-tab="validate">Valider</button>
  <button type="button" data-tab="journal">Journal</button>
</nav>
<div class="toast" id="toast"></div>

<script>
(function(){
  var KEY='radar_cockpit_v1';
  function seed(){
    return {
      run:true,
      priorities:[
        {id:'p1',title:'Dupont SA — facture 4 200 €',detail:'J+18 · aucune réponse · relance 3 prête',level:'high'},
        {id:'p2',title:'Devis Martin BTP 12 800 €',detail:'Envoyé J+9 · pas de relance encore',level:'med'},
        {id:'p3',title:'Leroy — promesse de paiement',detail:'Réponse reçue · pause auto suggérée',level:'low'}
      ],
      queue:[
        {id:'q1',client:'Dupont SA',type:'facture',amount:'4200',status:'scheduled',when:'Aujourd\'hui 10:00'},
        {id:'q2',client:'Martin BTP',type:'devis',amount:'12800',status:'scheduled',when:'Aujourd\'hui 14:00'},
        {id:'q3',client:'Atelier Nord',type:'facture',amount:'890',status:'sent',when:'Hier 09:12'},
        {id:'q4',client:'Leroy',type:'facture',amount:'2100',status:'paused',when:'Pause client'}
      ],
      validate:[
        {id:'v1',client:'Leroy',reason:'Réponse: « on paie vendredi »',suggestion:'Pause 7 jours'},
        {id:'v2',client:'Gamma Log',reason:'Montant transaction ≠ facture (±2%)',suggestion:'Ne rien envoyer'}
      ],
      journal:[
        {t:'Hier 09:12',txt:'Relance facture envoyée — Atelier Nord 890 €'},
        {t:'Hier 09:14',txt:'Journal OK · Gmail id #a91'},
        {t:'Lun 07:01',txt:'Cerveau envoyé · 3 priorités'},
        {t:'Lun 10:22',txt:'Relance devis Martin BTP (niv.2)'}
      ]
    };
  }
  function load(){
    try{var d=JSON.parse(localStorage.getItem(KEY));if(d)return d;}catch(e){}
    var s=seed();localStorage.setItem(KEY,JSON.stringify(s));return s;
  }
  function save(d){localStorage.setItem(KEY,JSON.stringify(d));}
  var state=load();

  function toast(m){
    var el=document.getElementById('toast');
    el.textContent=m;el.classList.add('show');
    setTimeout(function(){el.classList.remove('show');},1800);
  }
  function tab(name){
    document.querySelectorAll('.screen').forEach(function(s){s.classList.toggle('active',s.id==='screen-'+name);});
    document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===name);});
  }
  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.addEventListener('click',function(){tab(b.getAttribute('data-tab'));});
  });

  function render(){
    document.getElementById('todayDate').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
    var sent=state.journal.filter(function(j){return /envoy/i.test(j.txt);}).length;
    document.getElementById('sSent').textContent=String(sent||3);
    document.getElementById('sPending').textContent=String(state.validate.length);
    document.getElementById('sPaused').textContent=String(state.queue.filter(function(q){return q.status==='paused';}).length);
    var runBtn=document.getElementById('runToggle');
    runBtn.textContent=state.run?'RUN ON':'RUN OFF';
    runBtn.className='pill '+(state.run?'on':'off');

    var pr=document.getElementById('priorities');pr.innerHTML='';
    state.priorities.forEach(function(p,i){
      var c=document.createElement('div');c.className='card';
      c.innerHTML='<span class="badge">#'+(i+1)+'</span><h3></h3><p></p><p class="meta"></p>';
      c.querySelector('h3').textContent=p.title;
      c.querySelector('p').textContent=p.detail;
      c.querySelector('.meta').textContent=p.level==='high'?'Priorité haute':p.level==='med'?'Priorité moyenne':'À surveiller';
      pr.appendChild(c);
    });

    var ql=document.getElementById('queueList');ql.innerHTML='';
    state.queue.forEach(function(q){
      var c=document.createElement('div');c.className='card';
      var st=q.status==='sent'?'ok':q.status==='paused'?'warn':'';
      var label=q.status==='sent'?'Envoyé':q.status==='paused'?'Pause':'Programmé';
      c.innerHTML='<span class="badge '+st+'">'+label+'</span><h3></h3><p></p><div class="row"></div>';
      c.querySelector('h3').textContent=q.client+' · '+q.type+' '+q.amount+' €';
      c.querySelector('p').textContent=q.when;
      var row=c.querySelector('.row');
      if(q.status!=='paused'){
        var b=document.createElement('button');b.className='btn btn-ghost';b.textContent='Pause';
        b.onclick=function(){q.status='paused';q.when='Pause manuelle';save(state);render();toast('Pause · '+q.client);};
        row.appendChild(b);
      } else {
        var b2=document.createElement('button');b2.className='btn btn-ok';b2.textContent='Reprendre';
        b2.onclick=function(){q.status='scheduled';q.when='Repris';save(state);render();toast('Repris · '+q.client);};
        row.appendChild(b2);
      }
      ql.appendChild(c);
    });

    var vl=document.getElementById('validateList');vl.innerHTML='';
    if(!state.validate.length){vl.innerHTML='<div class="empty">Rien à valider. Radar tourne.</div>';}
    state.validate.forEach(function(v){
      var c=document.createElement('div');c.className='card';
      c.innerHTML='<span class="badge warn">Ambigu</span><h3></h3><p></p><p class="meta"></p><div class="row"></div>';
      c.querySelector('h3').textContent=v.client;
      c.querySelector('p').textContent=v.reason;
      c.querySelector('.meta').textContent='Suggestion : '+v.suggestion;
      var row=c.querySelector('.row');
      var ok=document.createElement('button');ok.className='btn btn-ok';ok.textContent='Valider';
      ok.onclick=function(){
        state.validate=state.validate.filter(function(x){return x.id!==v.id;});
        state.journal.unshift({t:'Maintenant',txt:'Validé · '+v.client+' · '+v.suggestion});
        save(state);render();toast('Validé');
      };
      var sk=document.createElement('button');sk.className='btn btn-skip';sk.textContent='Ignorer';
      sk.onclick=function(){
        state.validate=state.validate.filter(function(x){return x.id!==v.id;});
        state.journal.unshift({t:'Maintenant',txt:'Ignoré · '+v.client});
        save(state);render();toast('Ignoré');
      };
      row.appendChild(ok);row.appendChild(sk);
      vl.appendChild(c);
    });

    var jl=document.getElementById('journalList');jl.innerHTML='';
    state.journal.forEach(function(j){
      var c=document.createElement('div');c.className='card';
      c.innerHTML='<p class="meta"></p><p></p>';
      c.querySelector('.meta').textContent=j.t;
      c.querySelector('p').textContent=j.txt;
      jl.appendChild(c);
    });
  }

  document.getElementById('runToggle').onclick=function(){
    state.run=!state.run;save(state);render();
    toast(state.run?'Automatisations actives':'Pause globale');
  };
  render();
})();
</script>
</body>
</html>
